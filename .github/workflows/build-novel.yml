name: Build & Release EPUB and PDF

on:
  workflow_dispatch:
  schedule:
    # Run once on the 1st day of every month at 00:00 UTC
    - cron: "0 0 1 * *"
  push:
    # Trigger build only when novel content or generator files change
    paths:
      - "chapters/**"
      - "images/**"
      - "web/static/assets/cover.jpg"
      - "tools/**"
      - ".github/workflows/build-novel.yml"

# Required to create tags and publish GitHub Releases
permissions:
  contents: write

jobs:
  build-novel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install system libraries and CJK/Emoji fonts for WeasyPrint
      - name: Install WeasyPrint system dependencies and CJK/Emoji fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-color-emoji

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "tools/requirements.txt"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Generate EPUB
        env:
          PYTHONUTF8: "1"
          LANG: "C.UTF-8"
        run: python tools/create_epub.py

      - name: Generate PDF
        env:
          PYTHONUTF8: "1"
          LANG: "C.UTF-8"
        run: python tools/create_pdf.py

      # Generate date-based release tag and title (e.g., v12.11.2026)
      - name: Prepare Release Metadata
        id: release_meta
        run: |
          DATE_STR=$(date -u +'%d.%m.%Y')
          echo "tag=v${DATE_STR}" >> "$GITHUB_OUTPUT"
          echo "title=IBTVTHIOW v${DATE_STR}" >> "$GITHUB_OUTPUT"

      # Attach generated EPUB and PDF to the latest GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          make_latest: true
          files: |
            novel/I-Became-The-Villain-The-Hero-Is-Obsessed-With.epub
            novel/I-Became-The-Villain-The-Hero-Is-Obsessed-With.pdf
